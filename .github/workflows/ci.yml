name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No GTK/GStreamer here: only window.py and settings.py touch
      # PyGObject, and no test imports them, so the suite runs with no
      # graphical environment and no camera.
      - name: Install the package and the development tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest
